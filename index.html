<style>
/* ================= TOKENS =================
   Paleta NexVot: preto (Obsidian) + verde (Emerald). Os nomes das
   variáveis (--laranja etc.) ficaram do Zorvel para não quebrar o
   resto do CSS — o que importa é a cor que cada uma guarda agora. */
html[data-tema="escuro"]{
  --bg:#070A08; --side:#0A0F0C; --card:#0D1410; --card2:#121A15; --card3:#17201A;
  --linha:#1F2922; --linha2:#161E19;
  --txt:#F2F5F1; --txt2:#9FAEA6; --txt3:#6B7A72;
  --laranja:#13B76A; --verde:#13B76A; --ambar:#F59E0B; --vermelho:#EF4444;
  --violeta:#A855F7; --azul:#3B82F6; --campo:#0D1410;
  --sombra:0 1px 2px rgba(0,0,0,.4);
  --sombra2:0 20px 60px rgba(0,0,0,.6);
}
html[data-tema="claro"]{
  --bg:#F2F5F1; --side:#FFFFFF; --card:#FFFFFF; --card2:#EAF0EC; --card3:#DFE9E2;
  --linha:#D8E3DB; --linha2:#E4EEE7;
  --txt:#0B120E; --txt2:#48584E; --txt3:#6B7A70;
  --laranja:#0E8F58; --verde:#0E8F58; --ambar:#B7791F; --vermelho:#D22B2B;
  --violeta:#8B3DD9; --azul:#2563EB; --campo:#FFFFFF;
  --sombra:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.05);
  --sombra2:0 24px 64px rgba(16,24,40,.18);
}
:root{ --f:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f2:"Manrope",var(--f);
  --r:16px; --r2:12px; --r3:10px; --side-w:272px; --mola:cubic-bezier(.22,1,.32,1); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-family:var(--f2);font-weight:700;letter-spacing:-.02em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;font-family:var(--f)}
input,select,textarea{font:inherit;color:inherit;font-family:var(--f)}
/* iOS Safari da zoom em input com font-size < 16px ao receber foco.
   Mexer no meta viewport nao resolve: user-scalable=no e maximum-scale
   sao ignorados pelo Safari do iOS desde o iOS 10. */
@media (max-width:1000px){
  input,select,textarea,.campo,.fx,.busca input{font-size:16px}
}
button,.chip,.tec button,.trio button,.dup button,[data-acao]{touch-action:manipulation}
ul{list-style:none;margin:0;padding:0}
svg{display:block}
[hidden]{display:none !important}
.fab[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px;border-radius:6px}
button,[data-acao],.item,.chip{ -webkit-user-select:none; user-select:none }
::placeholder{color:var(--txt3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--linha);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.micro{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t2{color:var(--txt2)} .t3{color:var(--txt3)}
.pos{color:var(--verde)} .neg{color:var(--vermelho)} .inv{color:var(--ambar)}

/* ================= SPLASH / AUTH ================= */
.splash{display:grid;place-items:center;min-height:100dvh;gap:16px;text-align:center;padding:24px}
.splash .marca{display:flex;align-items:center;gap:12px}
.splash .st{color:var(--txt2);font-size:14px;max-width:400px;line-height:1.6}
.splash .st.erro{color:var(--vermelho)}

.mk i{display:none}
.mk.pq{width:34px;height:34px}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:100%;max-width:400px}
.auth-logo{display:flex;align-items:center;gap:13px;margin-bottom:32px}
.auth-logo h1{font-size:21px} .auth-logo p{margin:2px 0 0;font-size:13.5px;color:var(--txt2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border:1px solid var(--linha);border-radius:var(--r2);padding:5px;margin-bottom:20px}
.tabs button{padding:11px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--txt2)}
.tabs button.on{background:var(--card);color:var(--txt);box-shadow:var(--sombra)}
.campo{width:100%;background:var(--campo);border:1px solid var(--linha);border-radius:var(--r2);padding:14px 15px;margin-bottom:11px;font-size:15px}
.campo:focus{border-color:var(--laranja);outline:none}
.btn{width:100%;background:var(--laranja);color:#fff;border-radius:var(--r2);padding:15px;font-size:15px;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled,.btn-pri:disabled,.mini:disabled{opacity:.45;cursor:not-allowed;filter:none}
.msg{font-size:13.5px;margin-top:14px;min-height:19px;line-height:1.55;text-align:center}
.msg.erro{color:var(--vermelho)} .msg.ok{color:var(--verde)}
.auth-pe{margin-top:22px;text-align:center;font-size:13px;color:var(--txt3);line-height:1.6}
.auth-box h2{font-size:23px;letter-spacing:-.025em}
.auth-box .sub{font-size:14px;color:var(--txt2);margin:6px 0 24px;line-height:1.5}
.btn-social{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--card2);border:1px solid var(--linha);border-radius:var(--r2);
  padding:14px;font-size:15px;font-weight:600;margin-bottom:11px}
.btn-social:hover{border-color:var(--txt3)}
.btn-social svg{width:20px;height:20px;flex:none}
.btn-social[disabled]{opacity:.45;cursor:not-allowed}
.ou{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--txt3);font-size:13px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--linha)}
.campo-g{margin-bottom:13px}
.campo-g label{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:6px}
.campo-g .campo{margin-bottom:0}
.campo-g .erro{font-size:12.5px;color:var(--vermelho);margin-top:5px;display:none}
.campo-g.ruim .campo{border-color:var(--vermelho)}
.campo-g.ruim .erro{display:block}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:460px){ .dois{grid-template-columns:1fr} }
.troca{text-align:center;margin-top:18px;font-size:14px;color:var(--txt2)}
.troca button{color:var(--laranja);font-weight:600}

/* ================= ESTRUTURA ================= */
.app{display:flex;min-height:100dvh}
.side{width:var(--side-w);flex:none;background:var(--side);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:80;overflow-y:auto}
.conteudo{flex:1;min-width:0;margin-left:var(--side-w)}
body.recolhido{--side-w:76px}
body.recolhido .side-txt,body.recolhido .grupo-t,body.recolhido .busca{display:none}
body.recolhido .side .item{justify-content:center;padding:12px}
body.recolhido .side .lg{justify-content:center}
.side .lg{display:flex;align-items:center;gap:11px;padding:22px 20px 18px}
.side .lg h1{font-size:16.5px;letter-spacing:-.025em}
.side .lg p{margin:1px 0 0;font-size:12px;color:var(--txt3)}
.busca{margin:0 16px 20px;position:relative}
.busca input{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:var(--r3);padding:11px 12px 11px 38px;font-size:14px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2}
.busca kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f);font-size:11px;
  color:var(--txt3);border:1px solid var(--linha);border-radius:5px;padding:2px 6px;background:var(--card2)}
.grupo{padding:0 12px;margin-bottom:18px}
.grupo-t{display:flex;align-items:center;gap:7px;padding:0 10px 9px;font-size:11px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--txt3)}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px 10px 15px;border-radius:var(--r3);
  font-size:14px;font-weight:500;color:var(--txt2);text-align:left;position:relative;margin-bottom:2px}
.item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.item:hover{background:var(--card2);color:var(--txt)}
.item.on{background:color-mix(in srgb,var(--laranja) 11%,transparent);color:var(--laranja);font-weight:600}
.item.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--laranja);border-radius:0 3px 3px 0}
@media (prefers-reduced-motion:no-preference){ .item{transition:background .15s,color .15s} }
.side-fim{margin-top:auto;padding:16px 12px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--linha)}
/* seletor de Pessoal/Empresa + empresa, versão de dentro da gaveta —
   só aparece no celular, porque lá o topo (#seg-espaco/#tb-empresa) fica escondido. */
#grupo-espaco-m{display:none}

.topbar{height:70px;display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:44;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linha)}
.trilha{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--txt2);flex:1;min-width:0}
.trilha svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
.trilha .sep{color:var(--txt3)} .trilha b{color:var(--txt);font-weight:600}
.tb-acoes{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:var(--r3);display:grid;place-items:center;color:var(--txt2)}
.ib:hover{background:var(--card2);color:var(--txt)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lang{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r3);font-size:13px;font-weight:600;color:var(--txt2)}
.lang:hover{background:var(--card2);color:var(--txt)}
.tb-item{position:relative}
.ib.aberto,.lang.aberto{background:color-mix(in srgb,var(--laranja) 14%,transparent);color:var(--laranja)}
.pop{position:absolute;top:calc(100% + 10px);right:0;z-index:100;min-width:236px;
  background:var(--card);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--sombra2);
  padding:7px;opacity:0;transform:translateY(-7px) scale(.97);pointer-events:none;transform-origin:top right}
.pop.on{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:no-preference){ .pop{transition:opacity .16s var(--mola),transform .18s var(--mola)} }
.pop-t{font-size:15.5px;font-weight:700;padding:9px 11px 10px;letter-spacing:-.015em}
.pop-h{padding:11px;margin-bottom:6px;border-bottom:1px solid var(--linha)}
.pop-h .nm{font-size:14.5px;font-weight:600;line-height:1.3}
.pop-h .em{font-size:13px;color:var(--txt3);margin-top:2px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-i{display:flex;align-items:center;gap:12px;width:100%;padding:11px;border-radius:9px;
  font-size:14.5px;font-weight:500;color:var(--txt2);text-align:left}
.pop-i:hover{background:var(--card2);color:var(--txt)}
.pop-i.on{color:var(--txt)}
.pop-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pop-i .rd{width:16px;height:16px;flex:none;border-radius:99px;border:1.6px solid var(--linha);display:grid;place-items:center}
.pop-i.on .rd{border-color:var(--laranja)}
.pop-i.on .rd::after{content:"";width:8px;height:8px;border-radius:99px;background:var(--laranja)}
.pop-i.perigo{color:var(--laranja)}
.pop-i.perigo:hover{background:color-mix(in srgb,var(--laranja) 12%,transparent);color:var(--laranja)}
.pop-sep{height:1px;background:var(--linha);margin:6px 4px}

.perfil{display:flex;align-items:center;gap:11px;padding-left:14px;margin-left:6px;border-left:1px solid var(--linha);cursor:pointer;border-radius:10px}
.perfil:hover{background:var(--card2)}
.avatar{width:38px;height:38px;border-radius:99px;background:color-mix(in srgb,var(--laranja) 18%,transparent);
  color:var(--laranja);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.perfil .nm{font-size:14px;font-weight:600;line-height:1.25}
.perfil .em{font-size:12.5px;color:var(--txt3);line-height:1.25}
.tb-menu{display:none;width:38px;height:38px;border-radius:var(--r3);border:1px solid var(--linha);background:var(--card);place-items:center}
.tb-menu i{display:block;width:16px;height:2px;background:var(--txt);border-radius:2px;box-shadow:0 -5.5px 0 var(--txt),0 5.5px 0 var(--txt)}

.pagina{padding:30px 32px 80px;max-width:1560px}
.ph{display:flex;align-items:flex-start;gap:15px;margin-bottom:24px;flex-wrap:wrap}
.ph-ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--laranja) 13%,transparent);color:var(--laranja)}
.ph-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.card{container-type:inline-size}

.dia:hover{border-color:var(--txt3)}
.dia .n{font-size:14.5px;font-weight:600;color:var(--txt2);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.dia .f{position:absolute;inset:0;background:var(--vermelho);opacity:0}
.dia .m{display:flex;gap:4px;height:6px;position:relative;z-index:1}
.dia .m i{width:6px;height:6px;border-radius:99px;display:block}
.dia.fora{opacity:.3}
.dia.hoje{border-color:var(--laranja);border-width:2px}
.dia.hoje .n{color:var(--laranja)}
.dia.gastou .n{color:var(--txt)}
.dia.fech{box-shadow:inset 0 -3px 0 var(--verde)}
.drop{border:2px dashed var(--linha);border-radius:var(--r2);padding:48px 28px;text-align:center;background:var(--card2);
  display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer}
.drop.sobre{border-color:var(--laranja);background:color-mix(in srgb,var(--laranja) 7%,transparent)}
.drop svg{width:38px;height:38px;stroke:var(--laranja);fill:none;stroke-width:1.6}
.drop .tt{font-size:16px;font-weight:600}
.drop .ss{font-size:13.5px;color:var(--txt3)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:120;background:var(--card);
  border:1px solid var(--linha);border-radius:99px;padding:13px 22px;font-size:14px;font-weight:500;
  box-shadow:var(--sombra2);max-width:88vw;display:flex;align-items:center;gap:4px;white-space:nowrap}
.toast button{padding:4px 8px;border-radius:8px}
.toast button:hover{background:color-mix(in srgb,var(--laranja) 14%,transparent)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:sobeT .26s var(--mola)}
  @keyframes sobeT{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}} }

/* ================= CELULAR ================= */
@media (max-width:1000px){
  .side{transform:translateX(-100%);width:280px;box-shadow:var(--sombra2)}
  .side.aberta{transform:none}
  .conteudo{margin-left:0}
  .tb-menu{display:grid}
  .topbar{padding:0 16px;height:64px;gap:12px}
  .perfil .nm,.perfil .em{display:none}
  .perfil{padding-left:0;margin-left:0;border-left:none}
  #seg-espaco{display:none}
  #tb-empresa{display:none}
  #grupo-espaco-m{display:block}
  .pagina{padding:20px 16px 110px}
  .ph h1{font-size:26px}
  .ph-ic{width:48px;height:48px;border-radius:12px}
  .ph-ic svg{width:22px;height:22px}
  .ph{gap:14px;margin-bottom:22px}
  .seg button{padding:9px 13px;font-size:13.5px}
  .kpi{padding:20px} .kpi-v{font-size:32px}
  .sec-h h2{font-size:21px}
  .card.pad,.pad{padding:18px}
  .tb-h,.tb-l,.li,.form{padding-left:18px;padding-right:18px}
  .zero{margin:18px;width:calc(100% - 36px);padding:34px 20px}
  .status{padding:22px 20px}
  .fab:not([hidden]){display:grid}
  .com-y{padding-left:44px} .eixo-y{width:42px;font-size:10.5px}
  #bt-novo{display:none}
}
@media (max-width:1000px) and (prefers-reduced-motion:no-preference){ .side{transition:transform .3s var(--mola)} }
.fab{display:none;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;
  width:58px;height:58px;border-radius:99px;background:var(--laranja);color:#fff;place-items:center;
  box-shadow:0 10px 28px color-mix(in srgb,var(--laranja) 45%,transparent)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* ================= IDEIAS (lista + mapa mental) ================= */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.kanban-col{flex:0 0 260px;background:var(--card);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.kanban-col .tit{padding:14px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--linha);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.kanban-col .tit span.n{font-size:12px;font-weight:600;color:var(--txt3);background:var(--card2);
  border-radius:99px;padding:2px 8px}
.kanban-corpo{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:40px}
.ideia-card{background:var(--card2);border:1px solid var(--linha);border-radius:var(--r3);padding:11px 12px;
  cursor:pointer}
.ideia-card:hover{border-color:var(--txt3)}
.ideia-card .tt{font-size:13.5px;font-weight:600;line-height:1.4}
.ideia-card .ss{font-size:12.5px;color:var(--txt3);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kanban-add{padding:10px;border-top:1px solid var(--linha);display:flex;gap:7px}
.kanban-nova{display:flex;gap:8px;margin-bottom:14px}
.kanban-nova input{flex:1;min-width:0}

.mapa-wrap{position:relative;border:1px solid var(--linha);border-radius:var(--r);background:var(--card2);
  overflow:auto;height:min(620px,70dvh);touch-action:none}
.mapa-area{position:relative;width:1600px;height:1100px}
.mapa-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapa-svg line{stroke:var(--txt3);stroke-width:2;opacity:.55;pointer-events:stroke;cursor:pointer}
.mapa-svg line:hover{stroke:var(--vermelho);opacity:.9}
.no-mapa{position:absolute;width:180px;background:var(--card);border:2px solid var(--linha);border-radius:var(--r2);
  padding:10px 12px;box-shadow:var(--sombra);cursor:grab;user-select:none;touch-action:none}
.no-mapa:active{cursor:grabbing}
.no-mapa.ligando{border-color:var(--laranja);box-shadow:0 0 0 3px color-mix(in srgb,var(--laranja) 25%,transparent)}
.no-mapa .tt{font-size:13px;font-weight:700;line-height:1.35;pointer-events:none}
.no-mapa .ss{font-size:11.5px;color:var(--txt3);margin-top:3px;line-height:1.4;pointer-events:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.no-mapa .link{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:99px;
  background:var(--card);border:1px solid var(--linha);display:grid;place-items:center;color:var(--txt2)}
.no-mapa .link:hover{color:var(--laranja);border-color:var(--laranja)}
.no-mapa .link svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.mapa-dica{font-size:12.5px;color:var(--txt3);margin-top:10px;line-height:1.5}

/* ---- comprovante (foto/PDF anexado ao lançamento da empresa) ---- */
.comprovante-linha{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.comprovante-linha .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.comprovante-linha .mini svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.clip{color:var(--txt3);padding:9px;border-radius:8px;line-height:0;flex:none;
  min-width:36px;min-height:36px;display:grid;place-items:center}
.clip:hover{color:var(--laranja);background:var(--card3)}
.clip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

@media print{
  .side,.topbar,.fab,.form,.ph-acoes,.btn-pri,.btn-sec,.mini,.x,.zero{display:none !important}
  body,html{background:#fff}
  .conteudo{margin-left:0}
  .pagina{padding:0;max-width:none}
  .card{border:1px solid #ddd;break-inside:avoid;page-break-inside:avoid}
  .grade{gap:12px}
  *{color:#111 !important;background:#fff !important}
}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="marca"><span class="mk"><i></i></span><span style="font-family:var(--f2);font-size:22px;font-weight:700;letter-spacing:-.03em">NexVot</span></div>

</div>

          <input id="s-email" class="campo" type="email" autocomplete="email" inputmode="email"></div>
        <button id="bt-enviar-senha" class="btn" data-i="sen.enviar"></button>

    </div>

    <div id="a-msg" class="msg" role="status"></div>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <div class="lg"><span class="mk pq"><i></i></span>
      <div class="side-txt"><h1 data-i="app.nome">NexVot</h1><p data-i="app.sub">Gestão Pessoal</p></div></div>

    <div class="busca">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

    </div>

    <div class="grupo" id="grupo-espaco-m">

        <button data-e="empresa" data-i="esp.empresa">Empresa</button>
      </div>
      <div id="lista-empresas-m" hidden></div>
    </div>

    <div class="grupo">
      <div class="grupo-t"><span data-i="nav.principal">Principal</span></div>
      <button class="item on" data-v="painel">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>
        <span class="side-txt" data-i="nav.painel">Painel</span></button>
      <button class="item" data-v="consolidado">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="3" width="19" height="18" rx="3"/><path d="M7 9h10l-3-3M17 15H7l3 3"/></svg>
        <span class="side-txt" data-i="nav.consolidado">Consolidado</span></button>
    </div>

    <div class="grupo">
      <div class="grupo-t"><span data-i="nav.dinheiro">Dinheiro</span></div>
      <button class="item" data-v="fluxo"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg><span class="side-txt" data-i="nav.fluxo">Fluxo</span></button>
      <button class="item" data-v="orcamento"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg><span class="side-txt" data-i="nav.orcamento">Orçamento</span></button>
      <button class="item" data-v="recorrencias"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 0113.7-5.6L20 7"/><path d="M20 4v4h-4"/><path d="M20 14a8 8 0 01-13.7 5.6L4 17"/><path d="M4 20v-4h4"/></svg><span class="side-txt" data-i="nav.recorrencias">Recorrências</span></button>
      <button class="item" data-v="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span class="side-txt" data-i="nav.metas">Metas</span></button>
      <button class="item" id="item-cobrancas" data-v="cobrancas"><svg viewBox="0 0 24 24"><path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="side-txt" data-i="nav.cobrancas">Cobranças</span></button>

    <div class="grupo">

      <button class="item" data-v="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="side-txt" data-i="nav.agenda">Agenda</span></button>
      <button class="item" id="item-ideias" data-v="ideias" hidden><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3 11.2c.6.4 1 1 1 1.8v.5h4v-.5c0-.8.4-1.4 1-1.8A6 6 0 0012 3z"/></svg><span class="side-txt" data-i="nav.ideias">Ideias</span></button>

    <div class="grupo">

      <button class="item" data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9 2 2 0 11-2.8 2.8 1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2 2 2 0 11-2.8-2.8A1.7 1.7 0 002.5 14a2 2 0 110-4 1.7 1.7 0 001.2-2.9 2 2 0 112.8-2.8A1.7 1.7 0 009.4 3.1a2 2 0 114 0 1.7 1.7 0 002.9 1.2 2 2 0 112.8 2.8 1.7 1.7 0 001.2 2.9 2 2 0 110 4 1.7 1.7 0 00-1.2 1z"/></svg><span class="side-txt" data-i="nav.ajustes">Ajustes</span></button>
    </div>

    <div class="side-fim">

            <button class="pop-i" data-tema="sistema">

          <div class="pop" id="pop-perfil" role="menu" style="min-width:250px">

            <button class="pop-i" data-ir="ajustes">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>

            <div class="pop-sep"></div>
            <button class="pop-i perigo" id="pop-sair">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
              <span data-i="nav.sair">Sair</span></button>
          </div>
        </div>
      </div>
    </header>

    <main class="pagina">
      <div class="ph">
        <div class="ph-ic" id="ph-ic"></div>
        <div class="ph-txt"><h1 id="ph-tit"></h1><p id="ph-sub"></p></div>
        <div class="ph-acoes">
          <div class="seg" id="seg-periodo">
            <button data-p="hoje" data-i="per.hoje">Hoje</button>
            <button data-p="7" data-i="per.7">7 dias</button>
            <button data-p="30" data-i="per.30">30 dias</button>
            <button data-p="mes" class="on" data-i="per.mes">Mês</button>

          <div class="data-sel"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="periodo-label"></span></div>
          <button class="btn-pri" id="bt-novo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i="lanc.titulo">Novo lançamento</span></button>
        </div>
      </div>

      <section id="v-painel"></section>
      <section id="v-consolidado" hidden></section>
      <section id="v-fluxo" hidden></section>
      <section id="v-orcamento" hidden></section>
      <section id="v-recorrencias" hidden></section>
      <section id="v-metas" hidden></section>
      <section id="v-cobrancas" hidden></section>
      <section id="v-rotina" hidden></section>
      <section id="v-agenda" hidden></section>

      <section id="v-relatorios" hidden></section>

<div id="veu" class="veu" hidden></div>
<div id="sheets"></div>

<script src="./config.js"></script>
<script src="./i18n.js"></script>
<script>
window.addEventListener("error", function(e){
  var el=document.getElementById("splash-txt");
  if(el && !document.getElementById("splash").hidden){
    el.className="st erro";
    el.textContent="Erro ao carregar: "+(e.message||"arquivo não encontrado")+(e.filename?" · "+e.filename.split("/").pop():"");
  }
},true);
setTimeout(function(){
  var el=document.getElementById("splash-txt");
  if(!window.__OK__ && el && !document.getElementById("splash").hidden){
    el.className="st erro";
    el.textContent="O app.js não carregou em 10 segundos. Abra o console e leia a primeira linha vermelha.";
  }
},10000);
try{
  /* migração única: chaves zorvel:* -> nexvot:* (preserva preferências de quem já usava) */
  ["tema","espaco","recolhido"].forEach(function(k){
    var v=localStorage.getItem("zorvel:"+k);
    if(v!==null && localStorage.getItem("nexvot:"+k)===null){ localStorage.setItem("nexvot:"+k, v); }
  });
}catch(e){}
try{
  var t=localStorage.getItem("nexvot:tema")||"escuro";
  var real = t==="sistema"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro") : t;
  document.documentElement.dataset.tema = real;
  if(localStorage.getItem("nexvot:recolhido")==="1") document.body.classList.add("recolhido");
}catch(e){}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
